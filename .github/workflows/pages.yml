name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'surikaterna/formbar'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Build demo
        env:
          FORMBAR_DEMO_BASE: /formbar/
        run: bun run --filter @formbar/demos build

      - name: Build Web and TUI playground
        env:
          FORMBAR_TUI_BASE: /formbar/tui/
        run: bun run --filter @formbar/tui-interaction-spike build:browser

      - name: Add playground to Pages artifact
        run: mkdir -p apps/demos/dist/tui && cp -R apps/tui-interaction-spike/dist/. apps/demos/dist/tui/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demos/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
