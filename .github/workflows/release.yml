name: Version proposal and manual RC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-proposal:
    if: github.repository == 'surikaterna/formbar' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build
      - name: Refresh version proposal only
        uses: changesets/action@v1
        with:
          version: bun run version:packages
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-rc:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'surikaterna/formbar' && github.ref == 'refs/heads/main' && github.actor == 'spralle'
    runs-on: ubuntu-latest
    concurrency:
      group: formbar-manual-rc
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install npm and provision offline test tools
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund npm@11.20.0
          [[ "$(node --version)" == v22.23.2 && "$(npm --version)" == 11.20.0 ]]
          printf 'RC_NODE_BINARY=%s\nRC_NPM_ROOT=%s\n' "$(command -v node)" "$(npm root -g)/npm" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build
      - name: Test
        run: bun run test
      - name: Publish and check RC
        shell: bash
        run: |
          set -euo pipefail
          packages=(expressions core declarative from-schema react arbiter react-schema)
          version="$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const names = ['expressions', 'core', 'declarative', 'from-schema', 'react', 'arbiter', 'react-schema'];
          const manifests = names.map(name => JSON.parse(readFileSync(`packages/${name}/package.json`)));
          const version = manifests[0].version;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-rc\.(0|[1-9]\d*)$/.test(version) ||
              manifests.some((manifest, index) => manifest.version !== version || manifest.name !== `@formbar/${names[index]}`)) {
            throw new Error('All seven named packages must have the same well-formed RC version');
          }
          console.log(version);
          NODE
          )"
          snapshot="$(mktemp -d)"
          trap 'rm -rf "$snapshot"' EXIT
          for package in "${packages[@]}"; do
            npm view "@formbar/$package" dist-tags.latest --json > "$snapshot/$package.latest"
            printf '%s latest before: ' "@formbar/$package"
            cat "$snapshot/$package.latest"
            jq -e 'type == "string" and length > 0' "$snapshot/$package.latest"
          done
          for package in "${packages[@]}"; do
            if npm view "@formbar/$package@$version" name version --json > "$snapshot/exact.json"; then
              jq -e --arg name "@formbar/$package" --arg version "$version" '.name == $name and .version == $version' "$snapshot/exact.json"
              printf 'Skipping immutable existing %s@%s\n' "@formbar/$package" "$version"
            else
              jq -e '.error.code == "E404"' "$snapshot/exact.json"
              (cd "packages/$package" && npm publish --tag rc --access public --provenance)
            fi
          done
          for package in "${packages[@]}"; do
            npm view "@formbar/$package@$version" name version --json > "$snapshot/exact.json"
            cat "$snapshot/exact.json"
            jq -e --arg name "@formbar/$package" --arg version "$version" '.name == $name and .version == $version' "$snapshot/exact.json"
            npm view "@formbar/$package" dist-tags --json > "$snapshot/tags.json"
            cat "$snapshot/tags.json"
            jq -e --arg version "$version" --slurpfile latest "$snapshot/$package.latest" '.rc == $version and .latest == $latest[0]' "$snapshot/tags.json"
          done
