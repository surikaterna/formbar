name: Version proposal (release disabled)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Full lowercase SHA at the tip of main (NOT publish authorization)
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  version-proposal:
    if: github.repository == 'surikaterna/formbar' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build
      - name: Refresh version proposal only
        uses: changesets/action@v1
        with:
          version: bun run version:packages
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  reject-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: formbar-rc
    permissions:
      contents: read
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check run-bound release source and live policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: bun scripts/release/rc-dispatch-gate.ts
      - name: Refuse release until publish and reconciliation are independently verified
        run: |
          printf '::error::#363 release dispatch disabled: publish and postpublish reconciliation are not enabled.\n'
          exit 1
